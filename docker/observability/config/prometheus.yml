# Prometheus Configuration for Second Brain
# Metrics collection and alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'secondbrain'
    env: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager if needed: alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Second Brain Backend API
  # Assumes backend exposes /metrics endpoint on port 8080
  # Connect networks: docker network connect second-brain_default secondbrain-prometheus
  - job_name: 'secondbrain-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5001']  # For local development
        labels:
          service: 'secondbrain-api'
          environment: 'development'
    # Alternative: Use Docker network target
    # - targets: ['secondbrain-backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'secondbrain-backend'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

# Remote write for receiving metrics from OTLP
remote_write: []

# Enable exemplar storage for trace correlation
storage:
  tsdb:
    out_of_order_time_window: 30m
